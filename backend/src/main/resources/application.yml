server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: techearnest-crm
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/techearnest_crm}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:12MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}

crm:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    root: ${CRM_STORAGE_ROOT:./data/uploads}
  security:
    jwt-secret: ${JWT_SECRET:local-dev-only-change-me-use-32-byte-secret!}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
    refresh-cookie-name: ${JWT_REFRESH_COOKIE:te_refresh}
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-window: ${LOGIN_WINDOW:15m}
  self-service:
    app-base-url: ${APP_BASE_URL:http://localhost:5173}
    invite-ttl: ${INVITE_TTL:7d}
    timesheet-link-ttl: ${TIMESHEET_LINK_TTL:10d}
    weekly-timesheet-links: ${WEEKLY_TIMESHEET_LINKS:true}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level [%X{requestId}] [%X{userId}] [%X{organizationId}] %logger{36} - %msg%n"
